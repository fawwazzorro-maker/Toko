<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOKO RAJATU – Cijambe, Subang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap">
<style>
:root{--g:#2E7D32;--gd:#1B5E20;--o:#C2410C;--bg:#fff;--bg2:#F1F8F2;--tx:#1F2937;--mt:#4B5563;--bd:#D9E5DA;--cd:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4CAF50;--gd:#2E7D32;--o:#EA580C;--bg:#111827;--bg2:#162119;--tx:#F3F4F6;--mt:#B6BEC9;--bd:#2B3A2E;--cd:#1B2431}}
:root[data-theme="dark"]{--g:#4CAF50;--gd:#2E7D32;--o:#EA580C;--bg:#111827;--bg2:#162119;--tx:#F3F4F6;--mt:#B6BEC9;--bd:#2B3A2E;--cd:#1B2431}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;line-height:1.25;margin:0 0 .5em}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
.alt{background:var(--bg2)}
h2{font-size:1.7rem;text-align:center}
.sub{text-align:center;color:var(--mt);max-width:560px;margin:0 auto 28px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font:700 1.15rem Poppins,sans-serif;color:var(--g);text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;font-weight:500}
nav a:hover{color:var(--g)}
#bm{display:none;background:none;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:1.3rem;padding:4px 12px}
.btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:10px;border:0;cursor:pointer;font-size:1rem}
.btn:hover{background:var(--gd)}
.btn.o{background:var(--o)}
.btn.ol{background:none;color:var(--g);border:2px solid var(--g)}
.hero{text-align:center;padding:72px 0 64px;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.hero h1{font-size:2.4rem;color:var(--g)}
